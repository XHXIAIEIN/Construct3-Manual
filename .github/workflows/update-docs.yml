name: Update Construct 3 Docs
run-name: "${{ inputs.latest != '' && format('Update Construct 3 Docs · {0}', inputs.latest) || format('Check Construct 3 Docs · {0} #{1}', github.event_name, github.run_number) }}"

# Runs every Wednesday 10:00 UTC (after Scirra's typical Tuesday evening UK release)
on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:
    inputs:
      latest:
        description: 'Version to update to (e.g. r476.4). Leave empty to auto-check.'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write  # to self-dispatch with a version label

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine target version
        id: ver
        env:
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          CURRENT=$(node -e "
            const fs = require('fs');
            try {
              const m = fs.readFileSync('Construct3-Manual/index.md', 'utf8');
              const v = m.match(/^release:\s*(.+)$/m);
              process.stdout.write(v ? 'r' + v[1].trim() : 'unknown');
            } catch { process.stdout.write('unknown'); }
          ")
          # MODE=update when invoked with a version label; MODE=check otherwise.
          if [ -n "$INPUT_LATEST" ]; then
            LATEST="$INPUT_LATEST"
            MODE="update"
          else
            LATEST=$(node -e "
              const https = require('https');
              const req = https.get('https://editor.construct.net/versions.json', {
                headers: { 'User-Agent': 'Mozilla/5.0' }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  const v = JSON.parse(d);
                  const s = v.find(x => x.branchName === 'Stable');
                  process.stdout.write(s ? s.releaseName : 'unknown');
                });
              });
              req.on('error', () => process.stdout.write('unknown'));
            ")
            MODE="check"
          fi
          # Slug: dots -> dashes so branch names like r476-4 stay git-friendly.
          SLUG=$(echo "$LATEST" | tr . -)
          if [ "$CURRENT" = "$LATEST" ]; then
            CHANGED="false"
          else
            CHANGED="true"
          fi
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          if [ "$CHANGED" = "true" ]; then
            echo "## $CURRENT → $LATEST ($MODE)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## $CURRENT (up to date)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Current=$CURRENT  Latest=$LATEST  Mode=$MODE  Changed=$CHANGED"

      # CHECK mode + new version: dispatch self with version label so the
      # Actions list shows the version. This run exits as a no-op.
      - name: Dispatch update run with version label
        if: steps.ver.outputs.mode == 'check' && steps.ver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update-docs.yml -f latest='${{ steps.ver.outputs.latest }}'
          echo "::notice::Dispatched update run with version label ${{ steps.ver.outputs.latest }}"

      - name: Install dependencies (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update'
        run: cd .scripts && npm install

      - name: Install Chrome + xvfb (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update'
        run: sudo apt-get update && sudo apt-get install -y xvfb google-chrome-stable

      - name: Scrape Manual (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update'
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
        run: cd .scripts && xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" node autonomous-scraper.js manual --force

      - name: Scrape Addon SDK (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update'
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
        run: cd .scripts && xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" node autonomous-scraper.js addon-sdk --force

      - name: Scrape Game Services (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update'
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
        run: cd .scripts && xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" node autonomous-scraper.js game-services --force

      - name: Update README (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update'
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const count = dir => {
              let n = 0;
              const walk = d => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (e.isDirectory()) walk(path.join(d, e.name));
                  else if (e.name.endsWith('.md')) n++;
                }
              };
              walk(dir);
              return n;
            };
            const manual = count('Construct3-Manual');
            const sdk = count('Construct3-Addon-SDK');
            const gs = count('Construct3-Game-Services');
            const total = manual + sdk + gs;
            const latest = '${{ steps.ver.outputs.latest }}';
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme
              .replace(/release-r[\w.]+-blue/, 'release-' + latest + '-blue')
              .replace(/(\| \[Manual\][^|]+\| )\d+( \|)/, '$1' + manual + '$2')
              .replace(/(\| \[Addon SDK\][^|]+\| )\d+( \|)/, '$1' + sdk + '$2')
              .replace(/(\| \[Game Services\][^|]+\| )\d+( \|)/, '$1' + gs + '$2')
              .replace(/(\| \*\*Total\*\* \| \*\*)\d+(\*\*)/, '$1' + total + '$2')
              .replace(/(\| Construct 3 Manual \| )r[\w.]+( \|)/, '$1' + latest + '$2')
              .replace(/(\| Addon SDK \| )r[\w.]+( \|)/, '$1' + latest + '$2')
              .replace(/(\| Game Services \| )r[\w.]+( \|)/, '$1' + latest + '$2');
            fs.writeFileSync('README.md', readme);
            console.log('Manual:', manual, 'SDK:', sdk, 'GS:', gs, 'Total:', total);
          "

      - name: Create Pull Request (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update documentation to ${{ steps.ver.outputs.latest }}"
          title: "Update documentation to ${{ steps.ver.outputs.latest }}"
          body: |
            ${{ steps.ver.outputs.current }} → ${{ steps.ver.outputs.latest }}

            Auto-scraped from construct.net.
          branch: ${{ steps.ver.outputs.slug }}
          delete-branch: true
